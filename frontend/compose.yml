services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: react_frontend
    restart: unless-stopped
    # Vite only on Docker network — Traefik talks to nginx, not Vite directly
    expose:
      - "5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      VITE_API_URL: /api
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0"
    networks:
      - php_project_net

  frontend_nginx:
    image: nginx:1.28.0-alpine
    container_name: frontend_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - php_project_net
