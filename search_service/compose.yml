services:
  search_app:
    build:
      context: ..
      dockerfile: search_service/Dockerfile
      additional_contexts:
        "php-project-php-base:8.5": "service:php-base"
    image: search_service:local
    pull_policy: never
    container_name: search_service_app
    restart: unless-stopped
    # Internal only — reached via auth_service gateway (when wired)
    expose:
      - "8005"
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: search_service_db
      DB_PORT: 5432
      DB_DATABASE: search_db
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_HOSTS: http://search_opensearch:9200
      KAFKA_CACHE_DRIVER: array
      # Pin drivers so a stale .env cannot fall back to the database cache
      # (throttle:search uses RateLimiter → CACHE_STORE).
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      APP_URL: http://search_service_app:8005
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:'.getenv('NGINX_PORT').'/up')===false?1:0);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      search_db:
        condition: service_healthy
      search_opensearch:
        condition: service_healthy
    networks:
      - php_project_net

  search_db:
    image: postgres:16-alpine
    container_name: search_service_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5438:5432"
    environment:
      POSTGRES_DB: search_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - search_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d search_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - php_project_net

  search_opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: search_service_opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
      # Local Docker disks often sit above default 85/90/95% watermarks.
      cluster.routing.allocation.disk.watermark.low: 97%
      cluster.routing.allocation.disk.watermark.high: 98%
      cluster.routing.allocation.disk.watermark.flood_stage: 99%
      cluster.blocks.create_index.auto_release: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - search_osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - php_project_net

  search_opensearch_dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: search_service_opensearch_dashboards
    restart: unless-stopped
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://search_opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      search_opensearch:
        condition: service_healthy
    networks:
      - php_project_net

  search_kafka_product_consumer:
    image: search_service:local
    pull_policy: never
    container_name: search_kafka_product_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:product-events
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: search_service_db
      DB_PORT: 5432
      DB_DATABASE: search_db
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_HOSTS: http://search_opensearch:9200
      KAFKA_CACHE_DRIVER: array
    depends_on:
      search_app:
        condition: service_healthy
      search_db:
        condition: service_healthy
      search_opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

  search_kafka_category_consumer:
    image: search_service:local
    pull_policy: never
    container_name: search_kafka_category_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:category-events
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: search_service_db
      DB_PORT: 5432
      DB_DATABASE: search_db
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_HOSTS: http://search_opensearch:9200
      KAFKA_CACHE_DRIVER: array
    depends_on:
      search_app:
        condition: service_healthy
      search_db:
        condition: service_healthy
      search_opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

  search_kafka_stock_consumer:
    image: search_service:local
    pull_policy: never
    container_name: search_kafka_stock_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:stock-events
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: search_service_db
      DB_PORT: 5432
      DB_DATABASE: search_db
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_HOSTS: http://search_opensearch:9200
      KAFKA_CACHE_DRIVER: array
    depends_on:
      search_app:
        condition: service_healthy
      search_db:
        condition: service_healthy
      search_opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

  # Load testing — run manually:
  #   docker compose --profile loadtest run --rm search_k6 run /scripts/search-load.js
  search_k6:
    image: grafana/k6:1.0.0
    container_name: search_service_k6
    profiles:
      - loadtest
    volumes:
      - ./k6:/scripts:ro
    environment:
      BASE_URL: http://search_service_app:8005
    depends_on:
      - search_app
    networks:
      - php_project_net

  search_kafka_outbox_worker:
    image: search_service:local
    pull_policy: never
    container_name: search_kafka_outbox_worker
    restart: unless-stopped
    command: php artisan ecotone:run kafka-outbox
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: search_service_db
      DB_PORT: 5432
      DB_DATABASE: search_db
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      KAFKA_BROKERS: kafka:29092
      KAFKA_CACHE_DRIVER: array
    depends_on:
      search_app:
        condition: service_healthy
      search_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

  search_kafka_inbox_worker:
    image: search_service:local
    pull_policy: never
    container_name: search_kafka_inbox_worker
    restart: unless-stopped
    command: php artisan ecotone:run inbox
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: search_service_db
      DB_PORT: 5432
      DB_DATABASE: search_db
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_HOSTS: http://search_opensearch:9200
      KAFKA_CACHE_DRIVER: array
    depends_on:
      search_app:
        condition: service_healthy
      search_db:
        condition: service_healthy
      search_opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

volumes:
  search_osdata:
  search_pgdata:
