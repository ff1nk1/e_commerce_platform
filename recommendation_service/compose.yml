services:
  recommendation_app:
    build:
      context: ..
      dockerfile: recommendation_service/Dockerfile
      additional_contexts:
        "php-project-php-base:8.5": "service:php-base"
    image: recommendation_service:local
    pull_policy: never
    container_name: recommendation_service_app
    restart: unless-stopped
    expose:
      - "8007"
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_HOST: recommendation_service_db
      DB_PORT: 5432
      KAFKA_BROKERS: kafka:29092
      APP_URL: http://recommendation_service_app:8007
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:'.getenv('NGINX_PORT').'/up')===false?1:0);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      recommendation_db:
        condition: service_healthy
    networks:
      - php_project_net

  recommendation_db:
    image: pgvector/pgvector:pg16
    container_name: recommendation_service_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5437:5432"
    environment:
      POSTGRES_DB: recommendation_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - recommendation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d recommendation_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - php_project_net

  recommendation_scheduler:
    image: recommendation_service:local
    pull_policy: never
    container_name: recommendation_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_HOST: recommendation_service_db
      DB_PORT: 5432
      KAFKA_BROKERS: kafka:29092
      KAFKA_CACHE_DRIVER: array
    depends_on:
      recommendation_db:
        condition: service_healthy
      recommendation_app:
        condition: service_healthy
    networks:
      - php_project_net

  recommendation_kafka_product_consumer:
    image: recommendation_service:local
    pull_policy: never
    container_name: recommendation_kafka_product_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:product-events
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_HOST: recommendation_service_db
      DB_PORT: 5432
      KAFKA_BROKERS: kafka:29092
      KAFKA_CACHE_DRIVER: array
    depends_on:
      recommendation_db:
        condition: service_healthy
      recommendation_app:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

  recommendation_kafka_stock_consumer:
    image: recommendation_service:local
    pull_policy: never
    container_name: recommendation_kafka_stock_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:stock-events
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_HOST: recommendation_service_db
      DB_PORT: 5432
      KAFKA_BROKERS: kafka:29092
      KAFKA_CACHE_DRIVER: array
    depends_on:
      recommendation_db:
        condition: service_healthy
      recommendation_app:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

  recommendation_kafka_inbox_worker:
    image: recommendation_service:local
    pull_policy: never
    container_name: recommendation_kafka_inbox_worker
    restart: unless-stopped
    command: php artisan ecotone:run inbox
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_HOST: recommendation_service_db
      DB_PORT: 5432
      KAFKA_BROKERS: kafka:29092
      KAFKA_CACHE_DRIVER: array
    depends_on:
      recommendation_db:
        condition: service_healthy
      recommendation_app:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

volumes:
  recommendation_pgdata:
