version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
  settings:
    gocritic:
      # exitAfterDefer is on by default. Disable the other default checks
      # so gocritic only flags os.Exit after defer.
      disabled-checks:
        - appendAssign
        - argOrder
        - assignOp
        - badCall
        - badCond
        - captLocal
        - caseOrder
        - codegenComment
        - commentFormatting
        - defaultCaseOrder
        - deprecatedComment
        - dupArg
        - dupBranchBody
        - dupCase
        - dupSubExpr
        - elseif
        - flagDeref
        - flagName
        - ifElseChain
        - mapKey
        - newDeref
        - offBy1
        - regexpMust
        - singleCaseSwitch
        - sloppyLen
        - sloppyTypeAssert
        - switchTrue
        - typeSwitchVar
        - underef
        - unlambda
        - unslice
        - valSwap
        - wrapperFunc
    gosec:
      includes:
        - G115
  exclusions:
    paths:
      - vendor
