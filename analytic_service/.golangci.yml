version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    gosec:
      includes:
        - G115
    misspell:
      locale: US
      ignore-rules:
        - cancelled
  exclusions:
    paths:
      - vendor

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - analytic_service
