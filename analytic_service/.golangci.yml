# golangci-lint v1.64.x
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gofmt
    - goimports
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

linters-settings:
  goimports:
    local-prefixes: analytic_service
  misspell:
    locale: US
    # Domain / Kafka event vocabulary (British spelling kept on purpose).
    ignore-words:
      - cancelled
      - Cancelled

issues:
  exclude-dirs:
    - vendor
