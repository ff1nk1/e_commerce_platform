# PHP base image (php-fpm + nginx + CLI; build once, used by all Laravel services):
#   ./infra/build-base.sh
# or from repo root:
#   docker compose build php-base
#
# Each Laravel *_app uses entrypoint-http.sh with CMD http (nginx on :800x → php-fpm :9000).
# Workers override command to `php artisan …`; the entrypoint drops that process to www-data.
#
# Edge (Traefik): frontend + catalog admin (/admin-catalog via auth_service).
# React admin UI is served by frontend at /admin/*.
# Other auth_service API traffic still goes via frontend nginx /api proxy.

services:
  # Shared base image for Laravel services (additional_contexts service:php-base).
  # Exits immediately on `compose up` — image-only helper.
  php-base:
    build:
      context: ./php-base
      dockerfile: Dockerfile
    image: php-project-php-base:8.5
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      # File provider (Docker provider breaks on Docker Engine API >= 1.40)
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8081:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/certs:ro
    networks:
      - php_project_net

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # Stable KRaft identity — required so persisted data survives container recreate.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - php_project_net

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafbat-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

volumes:
  kafka_data:

networks:
  php_project_net:
    name: php_project_net
    driver: bridge
