; Overrides official image defaults (loaded after www.conf / zz-docker.conf).
[www]
listen = 127.0.0.1:9000
; Pass Docker/compose environment into PHP workers (Laravel .env + compose env).
clear_env = no
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
