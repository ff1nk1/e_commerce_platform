# File provider — avoids Docker API version mismatch with modern Docker Engine.
# frontend + catalog admin (via auth_service HTML proxy).

tls:
  certificates:
    - certFile: /certs/app.localhost.pem
      keyFile: /certs/app.localhost-key.pem

http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

  routers:
    http-redirect:
      rule: Host(`app.localhost`)
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: frontend
      priority: 1

    admin-catalog:
      rule: Host(`app.localhost`) && PathPrefix(`/admin-catalog`)
      entryPoints:
        - websecure
      service: auth
      tls: {}
      priority: 110

    # Filament CSS/JS/fonts + Livewire 4 hashed modules for catalog_service.
    # Direct to catalog — public static assets, no JWT.
    catalog-filament-assets:
      rule: "Host(`app.localhost`) && (PathPrefix(`/css/filament`) || PathPrefix(`/js/filament`) || PathPrefix(`/fonts/filament`) || PathRegexp(`^/livewire-[a-f0-9]+`))"
      entryPoints:
        - websecure
      service: catalog
      tls: {}
      priority: 120

    frontend:
      rule: Host(`app.localhost`)
      entryPoints:
        - websecure
      service: frontend
      tls: {}
      priority: 1

    # ClickHouse Play UI (built-in). HTTP only — cert covers app.localhost only.
    # Also reachable at http://localhost:8123/play
    clickhouse-play:
      rule: Host(`clickhouse.localhost`)
      entryPoints:
        - web
      service: clickhouse
      priority: 10

  services:
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend_nginx:80

    auth:
      loadBalancer:
        servers:
          - url: http://auth_service_app:8001

    catalog:
      loadBalancer:
        servers:
          - url: http://catalog_service_app:8002

    clickhouse:
      loadBalancer:
        servers:
          - url: http://analytic_clickhouse:8123
