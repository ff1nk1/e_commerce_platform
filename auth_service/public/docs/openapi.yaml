openapi: 3.1.0
info:
  title: php-project API
  version: "1.0.0"
  description: |
    Публичный контракт gateway (`auth_service`). Браузер ходит на `https://app.localhost`,
    nginx проксирует `/api` сюда. JWT проверяет только gateway.

    Авторизация: HttpOnly cookie `access_token` (и `refresh_token` для `/api/refresh`)
    либо заголовок `Authorization: Bearer`. В Swagger UI после успешного `POST /api/login`
    браузер сам сохраняет cookie; запросы дальше уходят с `credentials`.

    Для заказов и чата gateway подставляет `user_id` (у заказов ещё `email` и `name`) из JWT.
    Клиент эти поля не передаёт.

    Filament (`/admin-catalog`) и Kafka в эту спецификацию не входят.
servers:
  - url: /
    description: app.localhost
tags:
  - name: Auth
  - name: Catalog
  - name: Orders
  - name: Search
  - name: Recommendations
  - name: Notifications
  - name: Analytics
  - name: Stripe
paths:
  /api/registration:
    post:
      tags: [Auth]
      summary: Регистрация
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/login:
    post:
      tags: [Auth]
      summary: Вход
      description: Ставит HttpOnly cookie `access_token` и `refresh_token`. Тело ответа — только сообщение.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Cookie установлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/refresh:
    post:
      tags: [Auth]
      summary: Обновить access-токен
      description: Нужна cookie `refresh_token`. Новая пара cookie ставится в ответ.
      operationId: refresh
      responses:
        "200":
          description: Cookie обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/logout:
    post:
      tags: [Auth]
      summary: Выход
      operationId: logout
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Сессия сброшена, cookie очищены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/user:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      operationId: getUser
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Профиль с ролью
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profile:
    patch:
      tags: [Auth]
      summary: Обновить профиль
      operationId: updateProfile
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Профиль обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/profile/password:
    patch:
      tags: [Auth]
      summary: Сменить пароль
      description: Сбрасывает все сессии и очищает cookie.
      operationId: changePassword
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Пароль изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/admin/users:
    get:
      tags: [Auth]
      summary: Список пользователей
      description: Роль admin.
      operationId: listUsers
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
        - name: email
          in: query
          schema:
            type: string
          description: Подстрока email
      responses:
        "200":
          description: Страница пользователей
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/roles:
    get:
      tags: [Auth]
      summary: Список ролей
      description: Роль admin.
      operationId: listRoles
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Все роли
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/users/{id}/role:
    patch:
      tags: [Auth]
      summary: Сменить роль пользователя
      description: Роль admin.
      operationId: changeUserRole
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Роль обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/catalog/categories:
    get:
      tags: [Catalog]
      summary: Все категории
      description: Любая аутентифицированная роль.
      operationId: listCategories
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Плоский список категорий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/catalog/categories/{cat_slug}/products:
    get:
      tags: [Catalog]
      summary: Товары категории
      description: Категория и её потомки. Любая аутентифицированная роль.
      operationId: categoryProducts
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cat_slug
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/CatalogSearch"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/CatalogStatus"
        - $ref: "#/components/parameters/CatalogSort"
      responses:
        "200":
          description: Категория и страница товаров
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: "#/components/schemas/Category"
                  products:
                    allOf:
                      - $ref: "#/components/schemas/Page"
                      - type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/catalog/stores:
    get:
      tags: [Catalog]
      summary: Магазины витрины
      operationId: listStores
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Страница магазинов
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Store"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/catalog/stores/{store}:
    get:
      tags: [Catalog]
      summary: Карточка магазина
      operationId: showStore
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: store
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Магазин
          content:
            application/json:
              schema:
                type: object
                properties:
                  store:
                    $ref: "#/components/schemas/Store"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/catalog/stores/{store_id}/products:
    get:
      tags: [Catalog]
      summary: Товары магазина
      operationId: storeProducts
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/CatalogSearch"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/CatalogStatus"
        - $ref: "#/components/parameters/CatalogSort"
      responses:
        "200":
          description: Магазин и страница товаров
          content:
            application/json:
              schema:
                type: object
                properties:
                  store:
                    $ref: "#/components/schemas/Store"
                  products:
                    allOf:
                      - $ref: "#/components/schemas/Page"
                      - type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/catalog/products/{id}:
    get:
      tags: [Catalog]
      summary: Карточка товара
      operationId: showCatalogProduct
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Товар с категорией, магазином и атрибутами
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/products:
    get:
      tags: [Catalog]
      summary: Список товаров
      description: Роль admin.
      operationId: adminListProducts
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: store_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Страница товаров
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Catalog]
      summary: Создать товар
      description: Роль admin.
      operationId: adminCreateProduct
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
      responses:
        "201":
          description: Товар создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  product:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/admin/products/{product}:
    get:
      tags: [Catalog]
      summary: Товар для админки
      description: Роль admin.
      operationId: adminShowProduct
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Товар
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Catalog]
      summary: Заменить поля товара
      description: Роль admin. Поля необязательные (`sometimes`).
      operationId: adminReplaceProduct
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Товар обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  product:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [Catalog]
      summary: Частично обновить товар
      description: Роль admin.
      operationId: adminPatchProduct
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Товар обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  product:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Catalog]
      summary: Удалить товар
      description: Роль admin.
      operationId: adminDeleteProduct
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Товар удалён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/categories:
    get:
      tags: [Catalog]
      summary: Список категорий
      description: Роль admin.
      operationId: adminListCategories
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Страница категорий
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Catalog]
      summary: Создать категорию
      description: Роль admin.
      operationId: adminCreateCategory
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "201":
          description: Категория создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/admin/categories/{category}:
    get:
      tags: [Catalog]
      summary: Категория с родителем и детьми
      description: Роль admin.
      operationId: adminShowCategory
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Категория
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Catalog]
      summary: Обновить категорию
      description: Роль admin.
      operationId: adminReplaceCategory
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Категория обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [Catalog]
      summary: Частично обновить категорию
      description: Роль admin.
      operationId: adminPatchCategory
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Категория обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Catalog]
      summary: Удалить категорию
      description: Роль admin.
      operationId: adminDeleteCategory
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Категория удалена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/stores:
    get:
      tags: [Catalog]
      summary: Магазины для админки
      description: Роль admin. Тот же список, что у витрины.
      operationId: adminListStores
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Страница магазинов
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Store"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/stocks:
    get:
      tags: [Catalog]
      summary: Остатки
      description: Роль admin.
      operationId: listStocks
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: store_id
          in: query
          schema:
            type: integer
        - name: product_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Страница остатков
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Stock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Catalog]
      summary: Создать остаток
      description: Роль admin. Пара product_id + store_id уникальна.
      operationId: createStock
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
