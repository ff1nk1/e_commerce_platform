                  to:
                    type: [number, "null"]
                  count:
                    type: integer
            availability:
              type: array
              items:
                type: object
                properties:
                  value:
                    type: boolean
                  count:
                    type: integer
            attributes:
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                    count:
                      type: integer
        applied:
          type: object
          additionalProperties: true
    RecommendationHealth:
      type: object
      properties:
        status:
          type: string
