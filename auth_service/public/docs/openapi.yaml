          type: [string, "null"]
          format: uuid
        store_id:
          type: [integer, "null"]
          minimum: 1
        store_name:
          type: [string, "null"]
          maxLength: 255
        category_name:
          type: [string, "null"]
          maxLength: 255
        in_stock:
          type: [boolean, "null"]
        price_min:
          type: [number, "null"]
          minimum: 0
        price_max:
          type: [number, "null"]
          minimum: 0
        limit:
          type: [integer, "null"]
          minimum: 1
          maximum: 20
    ProductCard:
      type: object
      properties:
        product_id:
          type: integer
        store_id:
          type: [integer, "null"]
        store_name:
          type: [string, "null"]
        name:
          type: string
        description:
          type: [string, "null"]
        category_id:
          type: [integer, "null"]
        category_name:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
        price:
          type: number
        attributes:
          type: array
          items:
            type: object
            additionalProperties: true
        is_published:
          type: boolean
        in_stock:
          type: boolean
        path:
          type: string
    ChatResponse:
      type: object
      properties:
        conversation_id:
          type: string
          format: uuid
        answer:
          type: string
        extracted_filters:
          type: object
          additionalProperties: true
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductCard"
    Conversation:
