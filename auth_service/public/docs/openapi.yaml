  /api/get-upload-url:
    post:
      tags: [Catalog]
      summary: Presigned URL для картинки
      description: Роль admin. MIME jpeg, png, webp или gif. Ссылка живёт 5 минут.
      operationId: getUploadUrl
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type]
              properties:
                filename:
                  type: string
                  maxLength: 255
                  description: Имя должно заканчиваться на .jpg, .jpeg, .png, .webp или .gif
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, image/gif]
      responses:
        "200":
          description: URL для PUT и публичный путь
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url:
                    type: string
                  file_path:
                    type: string
                  public_url:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/orders:
    get:
      tags: [Orders]
      summary: Заказы текущего пользователя
      description: Gateway подставляет user_id из JWT.
      operationId: listOrders
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        "200":
          description: Страница заказов
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Orders]
      summary: Создать заказ
      description: |
        Нужен заголовок Idempotency-Key (до 128 символов).
        Цены берутся из снимка каталога. Gateway подставляет user_id, email и name из JWT.
      operationId: createOrder
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id:
                        type: integer
                        minimum: 1
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 1000
      responses:
        "201":
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Создание с тем же Idempotency-Key уже идёт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Заказ пользователя
      description: Gateway подставляет user_id. Чужой заказ не отдаётся.
      operationId: showOrder
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Заказ с позициями и платежами
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orders/{id}/cancel:
