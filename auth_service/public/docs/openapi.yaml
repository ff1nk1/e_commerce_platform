              slug:
                type: string
              orders_count:
                type: integer
              items_quantity:
                type: integer
              line_amount:
                type: string
              paid_line_amount:
                type: string
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
    SearchMetrics:
      type: object
      properties:
        total_searches:
