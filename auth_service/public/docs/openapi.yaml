        popular_queries:
          type: array
          items:
            $ref: "#/components/schemas/QueryCount"
        zero_result_queries:
          type: array
          items:
            $ref: "#/components/schemas/QueryCount"
    QueryCount:
      type: object
      properties:
        query:
          type: string
        count:
          type: integer
