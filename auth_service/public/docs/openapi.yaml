      description: |
        Без JWT. Тело — сырой JSON события Stripe, подпись в заголовке Stripe-Signature.
        Обрабатываются checkout.session.completed и checkout.session.expired.
      operationId: stripeWebhook
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Сырое событие Stripe. Схема события не фиксируется.
              additionalProperties: true
      responses:
        "200":
          description: Событие принято
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        "400":
          description: Подпись не сошлась
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly cookie, которую ставит POST /api/login
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProductId:
      name: product
      in: path
      required: true
      schema:
        type: integer
    CategoryId:
      name: category
      in: path
      required: true
      schema:
        type: integer
    StockId:
      name: stock
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    CatalogSearch:
      name: search
      in: query
      schema:
        type: string
        maxLength: 100
    MinPrice:
      name: min_price
      in: query
      schema:
        type: number
        minimum: 0
    MaxPrice:
      name: max_price
      in: query
      schema:
        type: number
        minimum: 0
    CatalogStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [in_stock]
    CatalogSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [new, price_asc, price_desc]
        default: new
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    From:
      name: from
      in: query
      schema:
        type: string
      description: YYYY-MM-DD или RFC3339
    To:
      name: to
      in: query
      schema:
        type: string
      description: YYYY-MM-DD (конец дня не включается) или RFC3339
    AnalyticsLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Нет или протух JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    Forbidden:
      description: Роли недостаточно
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    NotFound:
      description: Запись не найдена
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    BadRequest:
      description: Неверные query-параметры
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string
    Page:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        from:
          type: [integer, "null"]
        to:
          type: [integer, "null"]
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        created_at:
          type: [string, "null"]
        updated_at:
          type: [string, "null"]
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        number:
          type: [string, "null"]
        role_id:
          type: [integer, "null"]
        email_verified_at:
          type: [string, "null"]
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        created_at:
          type: [string, "null"]
        updated_at:
          type: [string, "null"]
    RegistrationRequest:
      type: object
      required: [name, email, password, number]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 30
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        number:
          type: string
          maxLength: 16
          description: E.164, например +48123456789
          pattern: "^\\+[1-9]\\d{9,14}$"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        number:
          type: string
          maxLength: 16
          pattern: "^\\+[1-9]\\d{9,14}$"
    Timestamps:
      type: object
      properties:
        created_at:
          type: [string, "null"]
        updated_at:
          type: [string, "null"]
    Category:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id:
              type: integer
            parent_id:
              type: [integer, "null"]
            name:
              type: string
            slug:
              type: string
            parent:
              type: [object, "null"]
            children:
              type: array
              items:
                type: object
    CategoryWrite:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
        parent_id:
          type: [integer, "null"]
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
        parent_id:
          type: [integer, "null"]
    Store:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id:
              type: integer
            name:
              type: string
            description:
              type: [string, "null"]
            contacts:
              type: [object, "null"]
              additionalProperties: true
    ProductAttribute:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        name:
          type: string
        value:
          type: string
    Product:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id:
              type: integer
            store_id:
              type: integer
            category_id:
              type: integer
            name:
              type: string
            description:
              type: [string, "null"]
            image_url:
              type: [string, "null"]
            price:
              type: string
              description: decimal:2
            is_published:
              type: boolean
            category:
              oneOf:
                - $ref: "#/components/schemas/Category"
                - type: "null"
            store:
              oneOf:
                - $ref: "#/components/schemas/Store"
                - type: "null"
            attributes:
              type: array
              items:
                $ref: "#/components/schemas/ProductAttribute"
    ProductWrite:
      type: object
      required: [store_id, category_id, name, price]
      properties:
        store_id:
          type: integer
        category_id:
          type: integer
        name:
          type: string
          maxLength: 255
        description:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
          maxLength: 255
        price:
          type: number
          minimum: 0
    ProductUpdate:
      type: object
      properties:
        store_id:
          type: integer
        category_id:
          type: integer
        name:
          type: string
          maxLength: 255
        description:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
          maxLength: 255
        price:
          type: number
          minimum: 0
    Stock:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id:
              type: integer
            product_id:
              type: integer
            store_id:
              type: integer
            quantity:
              type: integer
              description: Физический остаток
            reserved:
              type: integer
            available:
              type: integer
              description: quantity - reserved
            product:
              oneOf:
                - $ref: "#/components/schemas/Product"
                - type: "null"
            store:
              oneOf:
                - $ref: "#/components/schemas/Store"
                - type: "null"
    OrderStatus:
      type: string
      enum: [pending, awaiting_payment, confirmed, shipped, cancelled, payment_failed]
    ProductSnapshot:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: string
        store_id:
          type: [integer, "null"]
        store_name:
          type: [string, "null"]
        category_id:
          type: [integer, "null"]
        category_name:
          type: [string, "null"]
        category_slug:
          type: [string, "null"]
    OrderItem:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id:
              type: integer
            order_id:
              type: integer
            product_id:
              type: integer
            quantity:
              type: integer
            unit_price:
              type: string
            product_snapshot:
              oneOf:
                - $ref: "#/components/schemas/ProductSnapshot"
                - type: "null"
    Payment:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id:
              type: integer
            order_id:
              type: integer
            amount:
              type: string
            status:
              type: string
            stripe_checkout_session_id:
              type: [string, "null"]
            stripe_payment_intent_id:
              type: [string, "null"]
    Order:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id:
              type: integer
            saga_id:
              type: string
            user_id:
              type: integer
            customer_email:
              type: string
            customer_name:
              type: string
            status:
              $ref: "#/components/schemas/OrderStatus"
            cancel_reason:
              type: [string, "null"]
            total_amount:
              type: string
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"
            payments:
              type: array
              items:
                $ref: "#/components/schemas/Payment"
    SearchHit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, "null"]
        price:
          type: [number, "null"]
        image_url:
          type: [string, "null"]
        category_id:
          type: [integer, "null"]
        category_name:
          type: [string, "null"]
        store_id:
          type: [integer, "null"]
        store_name:
          type: [string, "null"]
        in_stock:
          type: boolean
        quantity:
          type: integer
        attributes:
          type: array
          items:
            type: object
            additionalProperties: true
    SearchResponse:
      type: object
      properties:
        products:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/SearchHit"
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
        facets:
          type: object
          properties:
            categories:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
