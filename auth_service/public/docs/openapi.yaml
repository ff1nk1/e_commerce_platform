  /api/search:
    get:
      tags: [Search]
      summary: Поиск товаров
      description: Без JWT. Фильтры режут выдачу, facets считаются по всему каталогу.
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 255
        - name: category_id
          in: query
          description: Один id или массив, не больше 50
          schema:
            oneOf:
              - type: integer
              - type: array
                maxItems: 50
                items:
                  type: integer
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - name: in_stock
          in: query
          schema:
            type: boolean
        - name: attr
          in: query
          description: "attr[Имя]=значение. До 20 имён, 20 значений на имя, 64 символа."
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, new]
      responses:
        "200":
          description: Выдача, facets и применённые фильтры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Превышен лимит запросов

  /api/search/autocomplete:
    get:
      tags: [Search]
      summary: Подсказки по названию
      description: Без JWT. Короче 2 символов ответ пустой.
      operationId: searchAutocomplete
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 255
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
        - name: fuzziness
          in: query
          schema:
            type: string
            enum: [AUTO, "0", "1", "2"]
            default: AUTO
      responses:
        "200":
          description: Подсказки
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        price:
                          type: [number, "null"]
                        image_url:
                          type: [string, "null"]
