services:
  order_app:
    build:
      context: ..
      dockerfile: order_service/Dockerfile
      additional_contexts:
        "php-project-php-base:8.5": "service:php-base"
    image: order_service:local
    pull_policy: never
    container_name: order_service_app
    restart: unless-stopped
    # Internal only — reached via auth_service gateway
    expose:
      - "8004"
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      # Unique hostnames on shared php_project_net
      DB_HOST: order_service_db
      DB_PORT: 5432
      REDIS_HOST: order_service_redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      APP_URL: http://order_service_app:8004
      CATALOG_DB_HOST: catalog_service_db
      CATALOG_DB_PORT: 5432
      CATALOG_DB_DATABASE: catalog_db
      CATALOG_DB_USERNAME: laravel
      CATALOG_DB_PASSWORD: secret
      # STRIPE_SECRET / STRIPE_WEBHOOK_SECRET come from env_file (.env) only —
      # do not set ${STRIPE_*} here: root compose has no values and would overwrite with "".
      STRIPE_SUCCESS_URL: https://app.localhost/orders/{ORDER_ID}?paid=1
      STRIPE_CANCEL_URL: https://app.localhost/orders/{ORDER_ID}?canceled=1
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:'.getenv('NGINX_PORT').'/up')===false?1:0);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      order_db:
        condition: service_healthy
      order_redis:
        condition: service_healthy
    networks:
      - php_project_net

  order_db:
    image: postgres:16-alpine
    container_name: order_service_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - order_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - php_project_net

  order_redis:
    image: redis:7-alpine
    container_name: order_service_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - order_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - php_project_net

  order_kafka_product_consumer:
    image: order_service:local
    pull_policy: never
    container_name: order_kafka_product_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:product-events
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_HOST: order_service_db
      DB_PORT: 5432
      REDIS_HOST: order_service_redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      # Avoid Predis stream errors killing the consumer on Redis blips during stack restarts.
      KAFKA_CACHE_DRIVER: array
    depends_on:
      order_app:
        condition: service_healthy
      order_db:
        condition: service_healthy
      order_redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

  order_kafka_stock_consumer:
    image: order_service:local
    pull_policy: never
    container_name: order_kafka_stock_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:stock-events
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_HOST: order_service_db
      DB_PORT: 5432
      REDIS_HOST: order_service_redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_CACHE_DRIVER: array
    depends_on:
      order_app:
        condition: service_healthy
      order_db:
        condition: service_healthy
      order_redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

  order_kafka_outbox_worker:
    image: order_service:local
    pull_policy: never
    container_name: order_kafka_outbox_worker
    restart: unless-stopped
    command: php artisan ecotone:run kafka-outbox
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_HOST: order_service_db
      DB_PORT: 5432
      REDIS_HOST: order_service_redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_CACHE_DRIVER: array
    depends_on:
      order_app:
        condition: service_healthy
      order_db:
        condition: service_healthy
      order_redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

  order_kafka_inbox_worker:
    image: order_service:local
    pull_policy: never
    container_name: order_kafka_inbox_worker
    restart: unless-stopped
    command: php artisan ecotone:run inbox
    volumes:
      - .:/var/www
      - ../packages/messaging:/var/packages/messaging:ro
    env_file:
      - .env
    environment:
      DB_HOST: order_service_db
      DB_PORT: 5432
      REDIS_HOST: order_service_redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_CACHE_DRIVER: array
    depends_on:
      order_app:
        condition: service_healthy
      order_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

volumes:
  order_pgdata:
  order_redisdata:
