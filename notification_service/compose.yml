services:
  notification_app:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        "php-project-php-base:8.5": "service:php-base"
    image: notification_service:local
    pull_policy: never
    container_name: notification_service_app
    restart: unless-stopped
    # Internal only — reached via auth_service gateway
    expose:
      - "8003"
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      # Mail log lives in Mongo. SQL is an unused Laravel skeleton, so sqlite
      # overrides a stale .env that still says pgsql.
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      QUEUE_CONNECTION: sync
      MONGODB_HOST: notification_service_mongodb
      MONGODB_PORT: 27017
      KAFKA_BROKERS: kafka:29092
      MAIL_HOST: notification_service_mailpit
      MAIL_PORT: 1025
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:'.getenv('NGINX_PORT').'/up')===false?1:0);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      notification_mongodb:
        condition: service_healthy
      notification_mailpit:
        condition: service_healthy
    networks:
      - php_project_net

  notification_mongodb:
    image: mongo:7.0
    container_name: notification_service_mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: notification_db
    volumes:
      - notification_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "root", "--password", "root", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - php_project_net

  notification_mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: notification_service_mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - php_project_net
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  notification_kafka_consumer:
    image: notification_service:local
    pull_policy: never
    container_name: notification_kafka_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:user-events
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      QUEUE_CONNECTION: sync
      MONGODB_HOST: notification_service_mongodb
      MONGODB_PORT: 27017
      KAFKA_BROKERS: kafka:29092
      MAIL_HOST: notification_service_mailpit
      MAIL_PORT: 1025
    depends_on:
      notification_app:
        condition: service_healthy
      notification_mongodb:
        condition: service_healthy
      notification_mailpit:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

  notification_kafka_order_consumer:
    image: notification_service:local
    pull_policy: never
    container_name: notification_kafka_order_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:order-events
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      QUEUE_CONNECTION: sync
      MONGODB_HOST: notification_service_mongodb
      MONGODB_PORT: 27017
      KAFKA_BROKERS: kafka:29092
      MAIL_HOST: notification_service_mailpit
      MAIL_PORT: 1025
    depends_on:
      notification_app:
        condition: service_healthy
      notification_mongodb:
        condition: service_healthy
      notification_mailpit:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - php_project_net

volumes:
  notification_mongodata:
